name: CI & Auto Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main

# Push novo na mesma branch cancela o run anterior ainda em curso:
# só o código mais recente é validado (economiza fila e evita PR fora de ordem).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sem permissões globais: cada job declara o mínimo (least privilege).

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante histórico completo para o git tag e ls-remote

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-url.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      - name: Workflow Summary
        if: always()
        run: |
          echo "### Gates Héstia" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Lint + typecheck + build + testes executados no job \`validate\` (somente leitura)." >> $GITHUB_STEP_SUMMARY

  # Item 8: contracts contra Supabase real efêmero (Postgres local no
  # runner + migrações aplicadas do zero + suite de integração).
  integration:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # supabase-js exige WebSocket nativo (só Node 22+); validate segue no 20.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Supabase CLI
        # setup-cli entregava v2.20.3 (sem -o env utilizável); fixa a versão
        # moderna via npm para init/start/status consistentes.
        run: npm install -g supabase@2.117.0

      - name: Start Supabase Local
        run: |
          supabase --version
          supabase init
          supabase start

      - name: Export Local Supabase Env
        run: |
          supabase status
          echo "--- variáveis disponíveis (valores mascarados) ---"
          supabase status -o env | sed -E 's/=.*$/=<masked>/'
          # Nomes reais da CLI moderna (DB_URL/API_URL/SERVICE_ROLE_KEY);
          # eval cobre com ou sem prefixo "export ". Aliases no padrão do job.
          eval "$(supabase status -o env)"
          {
            echo "POSTGRES_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Apply Migrations From Scratch
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
        run: |
          if [ -z "$POSTGRES_URL" ]; then
            echo "::error::POSTGRES_URL vazia após supabase status -o env; abortando antes do psql."
            exit 1
          fi
          for f in $(ls utils/migrations/migration-*.sql | sort); do
            echo "Aplicando $f..."
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run Integration Contracts
        env:
          SUPABASE_INTEGRATION_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration

  flow:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      pull-requests: write
      contents: write # push de tags e criação de releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante histórico completo para o git tag e ls-remote

      # Abre o Pull Request se as validações passarem e for um push em branch feature/*
      - name: Auto Create Feature Pull Request
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Verificando se já existe PR aberto para $BRANCH_NAME..."
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base develop --state open --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            echo "Nenhum PR aberto encontrado. Criando Pull Request para develop..."
            gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "PR Auto: $BRANCH_NAME" \
              --body "Este Pull Request foi criado automaticamente pelo pipeline de CI após a aprovação de todas as validações de linter, tipos, build e testes."
          else
            echo "PR #$PR_EXISTS já está aberto para a branch $BRANCH_NAME."
          fi

      # Detecta bump de versão para só promover release de verdade
      - name: Check Version Bump
        id: version
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          OLD=$(git show ${{ github.event.before }}:package.json 2>/dev/null | jq -r .version || echo "")
          NEW=$(jq -r .version package.json)
          echo "Versão antes: $OLD / agora: $NEW"
          if [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      # Abre o PR de develop para main só quando há bump de versão (intenção de release)
      - name: Auto Create Promotion Pull Request
        if: github.event_name == 'push' && github.ref_name == 'develop' && steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando se já existe PR aberto de develop para main..."
          PR_EXISTS=$(gh pr list --head develop --base main --state open --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            echo "Criando Pull Request de promoção (develop -> main)..."
            gh pr create \
              --base main \
              --head develop \
              --title "Release: develop -> main" \
              --body "Este Pull Request foi criado automaticamente pelo pipeline de CI para promover as alterações de develop para a main (Produção)."
          else
            echo "PR #$PR_EXISTS de develop para main já está aberto."
          fi

      # Cria a Tag Git e a GitHub Release no push da main (merge de release)
      - name: Create Tag and GitHub Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v$VERSION"
          echo "Versão identificada no package.json: $VERSION"

          echo "Verificando se a tag $TAG já existe no repositório..."
          TAG_EXISTS=$(git ls-remote --tags origin refs/tags/$TAG)

          if [ -z "$TAG_EXISTS" ]; then
            echo "A tag $TAG não existe. Configurando Git..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            echo "Criando tag local $TAG..."
            git tag "$TAG"

            echo "Empurrando tag $TAG para a origin..."
            git push origin "$TAG"

            echo "Criando Release no GitHub..."
            gh release create "$TAG" --generate-notes
          else
            echo "A tag $TAG já existe no repositório. Nenhuma nova release será gerada."
          fi
