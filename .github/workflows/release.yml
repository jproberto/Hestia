# Release automation separada da validação — least privilege e triggers distintos:
# o CI de validação (ci.yml) roda em feature/**, release/**, develop e main sem
# permissão de escrita de conteúdo; este workflow concentra a escrita (PRs de
# promoção, tags e releases) só em release/** e main.
name: Release Automation

on:
  push:
    branches:
      - release/**
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sem permissões globais: cada job declara o mínimo (least privilege).

jobs:
  # Promoção parte da branch de release (congelamento) — o que não entrou na release não vai para produção.
  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante histórico completo para o git tag e ls-remote

      # Detecta bump de versão comparando a branch da release com a main
      - name: Check Version Bump
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          git fetch origin main --quiet
          OLD=$(git show origin/main:package.json | jq -r .version || echo "")
          NEW=$(jq -r .version package.json)
          echo "Versão em main: $OLD / na release: $NEW"
          if [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      # Abre o PR da branch de release para main só quando há bump de versão (intenção de release)
      - name: Auto Create Promotion Pull Request
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Verificando se já existe PR aberto de $BRANCH_NAME para main..."
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            echo "Criando Pull Request de promoção ($BRANCH_NAME -> main)..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Release: $BRANCH_NAME -> main" \
              --body "Este Pull Request foi criado automaticamente pelo pipeline de CI para promover a branch de release $BRANCH_NAME para a main (Produção). A promoção parte da branch de release por congelamento: o que não entrou na release não vai para produção."
          else
            echo "PR #$PR_EXISTS de $BRANCH_NAME para main já está aberto."
          fi

  tag:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante histórico completo para o git tag e ls-remote

      # Cria a Tag Git e a GitHub Release no push da main (merge de release)
      - name: Create Tag and GitHub Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v$VERSION"
          echo "Versão identificada no package.json: $VERSION"

          echo "Verificando se a tag $TAG já existe no repositório..."
          TAG_EXISTS=$(git ls-remote --tags origin refs/tags/$TAG)

          if [ -z "$TAG_EXISTS" ]; then
            echo "A tag $TAG não existe. Configurando Git..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            echo "Criando tag local $TAG..."
            git tag "$TAG"

            echo "Empurrando tag $TAG para a origin..."
            git push origin "$TAG"

            echo "Criando Release no GitHub..."
            gh release create "$TAG" --generate-notes
          else
            echo "A tag $TAG já existe no repositório. Nenhuma nova release será gerada."
          fi
